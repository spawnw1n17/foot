name: AeroSphere browser QA

on:
  push:
    branches: [main, aerosphere-polish-v2]
    paths:
      - 'world-air-network/**'
      - '.github/workflows/aerosphere-browser.yml'
  pull_request:
    paths:
      - 'world-air-network/**'
      - '.github/workflows/aerosphere-browser.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply smooth rendering patch once
        run: |
          python3 world-air-network/tests/apply-smooth-rendering.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('world-air-network/src/route-guard.js')
          source = path.read_text()
          old = "new MutationObserver(queueRefresh).observe(cityLayer, { childList: true });"
          new = "new MutationObserver(queueRefresh).observe(cityLayer, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'stroke-dasharray'] });"
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit('route guard observer marker not found')
          PY
          node --check world-air-network/src/game.js
          node --check world-air-network/src/gesture-controls.js
          node --check world-air-network/src/polish.js
          node --check world-air-network/src/route-guard.js
          node --check world-air-network/sw.js
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add world-air-network/src/game.js world-air-network/src/gesture-controls.js world-air-network/src/polish.js world-air-network/src/route-guard.js world-air-network/sw.js
            git commit -m 'Сделать движение карты и самолётов плавным'
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check game engine and balance
        working-directory: world-air-network
        run: npm run check

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local game server
        run: |
          python3 -m http.server 8080 > "$RUNNER_TEMP/aerosphere-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/aerosphere-server.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/world-air-network/ | grep -q AeroSphere; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/aerosphere-server.log"
          exit 1

      - name: Play desktop and real-touch mobile scenario
        env:
          AEROSPHERE_URL: http://127.0.0.1:8080/world-air-network/
          QA_OUTPUT_DIR: artifacts/aerosphere-qa
        run: node world-air-network/tests/browser-check.mjs

      - name: Measure desktop and mobile frame smoothness
        env:
          AEROSPHERE_URL: http://127.0.0.1:8080/world-air-network/
          QA_OUTPUT_DIR: artifacts/aerosphere-qa
        run: node world-air-network/tests/smoothness-check.mjs

      - name: Upload QA report, screenshots and checked sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aerosphere-browser-qa-${{ github.sha }}
          path: |
            artifacts/aerosphere-qa
            world-air-network/src/game.js
            world-air-network/src/gesture-controls.js
            world-air-network/src/command-bridge.js
            world-air-network/src/route-guard.js
            world-air-network/tests/browser-check.mjs
            world-air-network/tests/smoothness-check.mjs
            ${{ runner.temp }}/aerosphere-server.log
          retention-days: 14
