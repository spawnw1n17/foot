name: One-time AeroSphere command API patch

on:
  push:
    branches: [aerosphere-drag-controls]
    paths:
      - '.github/workflows/aerosphere-command-api-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aerosphere-drag-controls
          fetch-depth: 0

      - name: Install direct game command API
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('world-air-network')
          game = root / 'src/game.js'
          source = game.read_text()
          if 'function installCommandApi()' not in source:
              source = source.replace('bindEvents();\nsetSpeed(1);', 'bindEvents();\ninstallCommandApi();\nsetSpeed(1);')
              marker = 'function frameLoop(now) {\n'
              api = '''function installCommandApi() {
            const api = Object.freeze({
              selectCity(cityId) {
                if (!cityMap[cityId]) return false;
                handleCityClick(cityId);
                return true;
              },
              proposeRoute(sourceId, targetId) {
                if (!cityMap[sourceId] || !cityMap[targetId] || sourceId === targetId) return false;
                if (!state.airports[sourceId] || !state.airports[targetId]) return false;
                routeDraftCityId = null;
                selectedCityId = sourceId;
                selectedRouteId = null;
                activeTab = 'city';
                syncTabs();
                proposeRoute(sourceId, targetId);
                return true;
              },
              getSnapshot() {
                return {
                  selectedCityId,
                  selectedRouteId,
                  routeDraftCityId,
                  gameSpeed,
                  airports: Object.keys(state.airports),
                  routes: state.routes.map((route) => route.id),
                  money: state.money,
                  clock: state.clock
                };
              }
            });

            Object.defineProperty(window, 'AeroSphereGame', {
              value: api,
              configurable: false,
              enumerable: false,
              writable: false
            });

            window.addEventListener('aerosphere:select-city', (event) => {
              api.selectCity(event.detail?.cityId);
            });
            window.addEventListener('aerosphere:propose-route', (event) => {
              api.proposeRoute(event.detail?.sourceId, event.detail?.targetId);
            });
          }

          function frameLoop(now) {
          '''
              if marker not in source:
                  raise SystemExit('game.js marker not found')
              source = source.replace(marker, api, 1)
              game.write_text(source)

          bridge = root / 'src/command-bridge.js'
          source = bridge.read_text()
          old = '''function selectCity(cityId) {
            if (!worldMap || !cityById.has(cityId)) return false;
          '''
          new = '''function selectCity(cityId) {
            if (!cityById.has(cityId)) return false;
            if (window.AeroSphereGame?.selectCity(cityId)) {
              window.__AEROSPHERE_QA__ && (window.__AEROSPHERE_QA__.lastCommand = `select:${cityId}`);
              return true;
            }
            if (!worldMap) return false;
          '''
          if old in source:
              source = source.replace(old, new, 1)
          old = '''async function proposeRoute(sourceId, targetId) {
            if (!cityById.has(sourceId) || !cityById.has(targetId) || sourceId === targetId) return false;
            selectCity(sourceId);
          '''
          new = '''async function proposeRoute(sourceId, targetId) {
            if (!cityById.has(sourceId) || !cityById.has(targetId) || sourceId === targetId) return false;
            if (window.AeroSphereGame?.proposeRoute(sourceId, targetId)) {
              window.__AEROSPHERE_QA__ && (window.__AEROSPHERE_QA__.lastCommand = `route:${sourceId}:${targetId}`);
              return true;
            }
            selectCity(sourceId);
          '''
          if old in source:
              source = source.replace(old, new, 1)
          bridge.write_text(source)

          gestures = root / 'src/gesture-controls.js'
          source = gestures.read_text()
          old = '''  async function beginRouteWorkflow(sourceId, targetId) {
            showGestureHint(`${cityNames.get(sourceId)} → ${cityNames.get(targetId)}: подтвердите строительство маршрута.`);
          '''
          new = '''  async function beginRouteWorkflow(sourceId, targetId) {
            showGestureHint(`${cityNames.get(sourceId)} → ${cityNames.get(targetId)}: подтвердите строительство маршрута.`);
            if (window.AeroSphereGame?.proposeRoute(sourceId, targetId)) return;
          '''
          if old in source:
              source = source.replace(old, new, 1)
          gestures.write_text(source)
          PY

          node --check world-air-network/src/game.js
          node --check world-air-network/src/command-bridge.js
          node --check world-air-network/src/gesture-controls.js
          grep -q 'function installCommandApi' world-air-network/src/game.js
          grep -q 'AeroSphereGame?.proposeRoute' world-air-network/src/gesture-controls.js

      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            echo 'Patch already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-air-network/src/game.js world-air-network/src/command-bridge.js world-air-network/src/gesture-controls.js
          git commit -m 'Подключить прямой API управления игровым движком'
          git push origin HEAD:aerosphere-drag-controls
