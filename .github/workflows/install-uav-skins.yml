name: Install realistic UAV skins

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-uav-skins.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Connect skins to the game
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('uav-sim/index.html')
          html = index.read_text(encoding='utf-8')
          if 'href="skins.css"' not in html:
              html = html.replace(
                  '  <link rel="stylesheet" href="styles.css">',
                  '  <link rel="stylesheet" href="styles.css">\n  <link rel="stylesheet" href="skins.css">'
              )
          if 'src="skins.js"' not in html:
              html = html.replace(
                  '  <script src="controls.js"></script>',
                  '  <script src="controls.js"></script>\n  <script src="skins.js"></script>'
              )
          index.write_text(html, encoding='utf-8')

          sw = Path('uav-sim/sw.js')
          text = sw.read_text(encoding='utf-8')
          text = text.replace("const CACHE='aurora-flight-v4';", "const CACHE='aurora-flight-v5';")
          if "'skins.css'" not in text:
              text = text.replace(
                  "'controls.js','manifest.webmanifest'",
                  "'controls.js','skins.js','skins.css','assets/uav-skins.png','manifest.webmanifest'"
              )
          sw.write_text(text, encoding='utf-8')

          pages = Path('.github/workflows/pages.yml')
          text = pages.read_text(encoding='utf-8')
          if 'uav-sim/skins.js' not in text:
              text = text.replace(
                  '            uav-sim/controls.js \\\n            uav-sim/sw.js;',
                  '            uav-sim/controls.js \\\n            uav-sim/skins.js \\\n            uav-sim/sw.js;'
              )
          if 'test -s uav-sim/skins.css' not in text:
              text = text.replace(
                  '          test -s uav-sim/styles.css',
                  '          test -s uav-sim/styles.css\n          test -s uav-sim/skins.css\n          test -s uav-sim/assets/uav-skins.png'
              )
          text = text.replace(
              'for asset in styles.css data.js app.js map.js flight.js controls.js manifest.webmanifest icon.svg; do',
              'for asset in styles.css skins.css data.js app.js map.js flight.js controls.js skins.js assets/uav-skins.png manifest.webmanifest icon.svg; do'
          )
          if "grep -q 'data-skin=\"mini\"'" not in text:
              text = text.replace(
                  "          grep -q 'data-model=\"mini\"' \"$RUNNER_TEMP/uav-dom.html\"",
                  "          grep -q 'data-model=\"mini\"' \"$RUNNER_TEMP/uav-dom.html\"\n          grep -q 'data-skin=\"mini\"' \"$RUNNER_TEMP/uav-dom.html\"\n          grep -q 'uav-skin-preview' \"$RUNNER_TEMP/uav-dom.html\""
              )
          pages.write_text(text, encoding='utf-8')

          readme = Path('uav-sim/README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '## Реалистичные скины'
          if marker not in text:
              text += '\n\n## Реалистичные скины\n\nВсе 16 аппаратов получили отдельные прозрачные игровые скины. Они используются на карте, в карточке выбранной модели и в списке ангара.\n'
          readme.write_text(text, encoding='utf-8')
          PY

      - name: Validate patched files
        run: |
          set -e
          grep -q 'skins.css' uav-sim/index.html
          grep -q 'skins.js' uav-sim/index.html
          grep -q 'uav-skins.png' uav-sim/sw.js
          node --check uav-sim/skins.js
          test -s uav-sim/assets/uav-skins.png

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uav-sim/index.html uav-sim/sw.js uav-sim/README.md .github/workflows/pages.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Подключить реалистичные скины БПЛА"
            git push origin HEAD:main
          fi
