name: Deploy Aurora Eleven to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Validate UAV simulator
        run: |
          set -e
          for file in \
            uav-sim/data.js \
            uav-sim/app.js \
            uav-sim/map.js \
            uav-sim/flight.js \
            uav-sim/controls.js \
            uav-sim/skins.js \
            uav-sim/sw.js; do
            node --check "$file"
          done
          test -s uav-sim/index.html
          test -s uav-sim/styles.css
          test -s uav-sim/skins.css
          test -s uav-sim/assets/uav-skins.svg
          test -s uav-sim/manifest.webmanifest
          test -s uav-sim/icon.svg
          grep -q "Аврора Полёт" uav-sim/index.html
          grep -q "MISSION_CATALOG" uav-sim/data.js
          grep -q "serviceWorker" uav-sim/controls.js
          grep -q "installUavSkins" uav-sim/controls.js
          grep -q "uav-skin-preview" uav-sim/skins.js

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify simulator endpoint and assets
        run: |
          set -e
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/uav-sim"
          curl --fail --location --retry 18 --retry-delay 5 --retry-all-errors --max-time 20 "$BASE/" | grep -q "Аврора Полёт"
          for asset in styles.css skins.css data.js app.js map.js flight.js controls.js skins.js assets/uav-skins.svg manifest.webmanifest icon.svg; do
            curl --fail --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "$BASE/$asset" >/dev/null
          done
          echo "Verified assets: $BASE/"

      - name: Open published game in Chromium
        run: |
          set -e
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/uav-sim/?build=${{ github.sha }}"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,900 \
            --virtual-time-budget=12000 \
            --dump-dom "$BASE" > "$RUNNER_TEMP/uav-dom.html"
          grep -q 'data-mission="daily"' "$RUNNER_TEMP/uav-dom.html"
          grep -q 'data-model="mini"' "$RUNNER_TEMP/uav-dom.html"
          grep -q 'data-skin="mini"' "$RUNNER_TEMP/uav-dom.html"
          grep -q 'uav-skin-preview' "$RUNNER_TEMP/uav-dom.html"
          grep -q 'uav-skin-thumb' "$RUNNER_TEMP/uav-dom.html"
          grep -q 'КАРЬЕРА ПИЛОТА' "$RUNNER_TEMP/uav-dom.html"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,900 \
            --virtual-time-budget=9000 \
            --screenshot="$RUNNER_TEMP/uav-desktop.png" "$BASE"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=390,844 \
            --force-device-scale-factor=1 \
            --virtual-time-budget=9000 \
            --screenshot="$RUNNER_TEMP/uav-mobile.png" "$BASE"
          test -s "$RUNNER_TEMP/uav-desktop.png"
          test -s "$RUNNER_TEMP/uav-mobile.png"
          echo "Chromium skin test passed: $BASE"

      - name: Upload browser screenshots
        uses: actions/upload-artifact@v4
        with:
          name: uav-simulator-browser-check-${{ github.sha }}
          path: |
            ${{ runner.temp }}/uav-desktop.png
            ${{ runner.temp }}/uav-mobile.png
            ${{ runner.temp }}/uav-dom.html
          retention-days: 14

      - name: Record successful publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[AUTO] Скины и Chromium проверены ${{ github.sha }}" \
            --body "Реалистичные скины БПЛА опубликованы и проверены в Chromium: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/uav-sim/"
