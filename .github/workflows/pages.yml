name: Deploy browser games to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate main project
        run: npm run check
      - name: Validate NEON DOMINION WAR ROOM
        working-directory: neon-dominion
        run: |
          set -e
          npm run check
          for file in styles-v2.css styles-v4.css styles-v5.css styles-v6.css styles-v6-home.css styles-v7.css src/territory.js src/meta.js src/home-profile.js src/war-room-core.js src/war-room.js WAR-ROOM.md; do
            test -s "$file"
          done
          for asset in assets/arena-background.svg assets/base-core.svg assets/base-factory.svg assets/base-fortress.svg assets/base-relay.svg assets/base-reactor.svg; do
            test -s "$asset"
          done
          grep -q "WAR ROOM UPDATE" index.html
          grep -q "styles-v7.css" index.html
          grep -q "war-room.js" index.html
          grep -q "WarRoomController" src/war-room.js
          grep -q "WORLD_REGIONS" src/war-room-core.js
          grep -q "buildNode" src/engine.js
          grep -q "startWarLevel" src/game.js
          grep -q "neon-dominion-v7" sw.js
      - name: Validate UAV simulator
        run: |
          set -e
          for file in uav-sim/data.js uav-sim/app.js uav-sim/map.js uav-sim/flight.js uav-sim/controls.js uav-sim/skins.js uav-sim/sw.js; do node --check "$file"; done
          test -s uav-sim/index.html
          test -s uav-sim/styles.css
          test -s uav-sim/skins.css
          test -s uav-sim/assets/uav-skins.svg
          test -s uav-sim/manifest.webmanifest
          test -s uav-sim/icon.svg
          grep -q "Аврора Полёт" uav-sim/index.html

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify published WAR ROOM assets
        run: |
          set -e
          ROOT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          UAV="$ROOT/uav-sim"
          NEON="$ROOT/neon-dominion"
          curl --fail --location --retry 18 --retry-delay 5 --retry-all-errors "$UAV/" | grep -q "Аврора Полёт"
          curl --fail --location --retry 18 --retry-delay 5 --retry-all-errors "$NEON/" | grep -q "NEON DOMINION"
          for asset in styles.css styles-v2.css styles-v4.css styles-v5.css styles-v6.css styles-v6-home.css styles-v7.css src/maps.js src/engine.js src/territory.js src/meta.js src/home-profile.js src/war-room-core.js src/war-room.js src/game.js sw.js manifest.webmanifest WAR-ROOM.md assets/icon.svg assets/arena-background.svg assets/base-core.svg assets/base-factory.svg assets/base-fortress.svg assets/base-relay.svg assets/base-reactor.svg; do
            curl --fail --location --retry 8 --retry-delay 3 --retry-all-errors "$NEON/$asset" >/dev/null
          done
          curl --fail --location "$NEON/src/game.js" | grep -q "startWarLevel"
          curl --fail --location "$NEON/src/engine.js" | grep -q "buildNode"
          curl --fail --location "$NEON/src/war-room.js" | grep -q "WarRoomController"
          curl --fail --location "$NEON/src/war-room-core.js" | grep -q "WORLD_REGIONS"
          curl --fail --location "$NEON/sw.js" | grep -q "neon-dominion-v7"
          curl --fail --location "$NEON/" | grep -q "styles-v7.css"
          echo "Verified WAR ROOM: $NEON/"
      - name: Open published WAR ROOM in Chromium
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          ROOT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          NEON="$ROOT/neon-dominion/?build=${{ github.sha }}"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=16000 --dump-dom "$NEON" > "$RUNNER_TEMP/neon-dom.html"
          grep -q 'id="battlefield"' "$RUNNER_TEMP/neon-dom.html"
          grep -q 'NEON DOMINION' "$RUNNER_TEMP/neon-dom.html"
          grep -q 'id="homeProfileDock"' "$RUNNER_TEMP/neon-dom.html"
          grep -q 'id="warRoomHomeBtn"' "$RUNNER_TEMP/neon-dom.html"
          grep -q 'id="warRoomOverlay"' "$RUNNER_TEMP/neon-dom.html"
          grep -q 'class="world-region' "$RUNNER_TEMP/neon-dom.html"
          grep -q 'id="warBattlePanel"' "$RUNNER_TEMP/neon-dom.html"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=11000 --screenshot="$RUNNER_TEMP/neon-desktop.png" "$NEON"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=11000 --screenshot="$RUNNER_TEMP/neon-mobile.png" "$NEON"
          test -s "$RUNNER_TEMP/neon-desktop.png"
          test -s "$RUNNER_TEMP/neon-mobile.png"
      - name: Upload publication screenshots
        uses: actions/upload-artifact@v4
        with:
          name: browser-games-war-room-${{ github.sha }}
          path: |
            ${{ runner.temp }}/neon-desktop.png
            ${{ runner.temp }}/neon-mobile.png
            ${{ runner.temp }}/neon-dom.html
          retention-days: 14
      - name: Record successful WAR ROOM publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "[AUTO] NEON DOMINION WAR ROOM опубликована ${{ github.sha }}" --body "WAR ROOM, глобальная карта, редактор, новые режимы и расширенный профиль опубликованы и проверены в Chromium: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/neon-dominion/"
