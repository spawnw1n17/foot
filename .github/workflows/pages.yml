name: Deploy Aurora Eleven to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Validate UAV simulator modules
        run: |
          node --check uav-sim/app.js
          node --check uav-sim/map.js
          node --check uav-sim/flight.js
          node --check uav-sim/controls.js

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify simulator in browser endpoint
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/uav-sim/"
          curl --fail --location --retry 18 --retry-delay 5 --retry-all-errors --max-time 20 "$URL" | grep -q "Аврора Полёт"
          echo "Verified: $URL"
      - name: Record successful publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[AUTO] Публикация игры проверена ${{ github.sha }}" \
            --body "GitHub Pages доступен: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/uav-sim/"
