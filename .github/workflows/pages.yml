name: Deploy browser games to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate main project
        run: npm run check
      - name: Validate NEON DOMINION home profile
        working-directory: neon-dominion
        run: |
          set -e
          npm run check
          test -s styles-v2.css
          test -s styles-v4.css
          test -s styles-v5.css
          test -s styles-v6.css
          test -s styles-v6-home.css
          test -s src/territory.js
          test -s src/meta.js
          test -s src/home-profile.js
          for asset in assets/arena-background.svg assets/base-core.svg assets/base-factory.svg assets/base-fortress.svg assets/base-relay.svg assets/base-reactor.svg; do
            test -s "$asset"
          done
          grep -q "ARSENAL UPDATE" index.html
          grep -q "styles-v6.css" index.html
          grep -q "home-profile.js" index.html
          grep -q "sendRoute" src/engine.js
          grep -q "MetaController" src/meta.js
          grep -q "homeProfileDock" src/home-profile.js
          grep -q "getMeta" src/game.js
          grep -q "neon-dominion-v6" sw.js
      - name: Validate UAV simulator
        run: |
          set -e
          for file in uav-sim/data.js uav-sim/app.js uav-sim/map.js uav-sim/flight.js uav-sim/controls.js uav-sim/skins.js uav-sim/sw.js; do node --check "$file"; done
          test -s uav-sim/index.html
          test -s uav-sim/styles.css
          test -s uav-sim/skins.css
          test -s uav-sim/assets/uav-skins.svg
          test -s uav-sim/manifest.webmanifest
          test -s uav-sim/icon.svg
          grep -q "Аврора Полёт" uav-sim/index.html

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify published endpoints and main profile assets
        run: |
          set -e
          ROOT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          UAV="$ROOT/uav-sim"
          NEON="$ROOT/neon-dominion"
          curl --fail --location --retry 18 --retry-delay 5 --retry-all-errors "$UAV/" | grep -q "Аврора Полёт"
          curl --fail --location --retry 18 --retry-delay 5 --retry-all-errors "$NEON/" | grep -q "NEON DOMINION"
          for asset in styles.css styles-v2.css styles-v4.css styles-v5.css styles-v6.css styles-v6-home.css src/maps.js src/engine.js src/territory.js src/meta.js src/home-profile.js src/game.js sw.js manifest.webmanifest assets/icon.svg assets/arena-background.svg assets/base-core.svg assets/base-factory.svg assets/base-fortress.svg assets/base-relay.svg assets/base-reactor.svg; do
            curl --fail --location --retry 8 --retry-delay 3 --retry-all-errors "$NEON/$asset" >/dev/null
          done
          curl --fail --location "$NEON/src/game.js" | grep -q "getMeta"
          curl --fail --location "$NEON/src/meta.js" | grep -q "MetaController"
          curl --fail --location "$NEON/src/home-profile.js" | grep -q "homeProfileDock"
          curl --fail --location "$NEON/sw.js" | grep -q "neon-dominion-v6"
          curl --fail --location "$NEON/" | grep -q "styles-v6-home.css"
          echo "Verified main profile: $NEON/"
      - name: Open published games in Chromium
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          ROOT="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          NEON="$ROOT/neon-dominion/?build=${{ github.sha }}"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=14000 --dump-dom "$NEON" > "$RUNNER_TEMP/neon-dom.html"
          grep -q 'id="battlefield"' "$RUNNER_TEMP/neon-dom.html"
          grep -q 'NEON DOMINION' "$RUNNER_TEMP/neon-dom.html"
          grep -q 'id="territoryConsole"' "$RUNNER_TEMP/neon-dom.html"
          grep -q 'id="playerProfileBtn"' "$RUNNER_TEMP/neon-dom.html"
          grep -q 'id="arsenalOverlay"' "$RUNNER_TEMP/neon-dom.html"
          grep -q 'id="homeProfileDock"' "$RUNNER_TEMP/neon-dom.html"
          grep -q 'class="home-profile-main"' "$RUNNER_TEMP/neon-dom.html"
          grep -q 'data-home-tab="shop"' "$RUNNER_TEMP/neon-dom.html"
          grep -q 'data-home-tab="season"' "$RUNNER_TEMP/neon-dom.html"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=9000 --screenshot="$RUNNER_TEMP/neon-desktop.png" "$NEON"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=9000 --screenshot="$RUNNER_TEMP/neon-mobile.png" "$NEON"
          test -s "$RUNNER_TEMP/neon-desktop.png"
          test -s "$RUNNER_TEMP/neon-mobile.png"
      - name: Upload publication screenshots
        uses: actions/upload-artifact@v4
        with:
          name: browser-games-check-${{ github.sha }}
          path: |
            ${{ runner.temp }}/neon-desktop.png
            ${{ runner.temp }}/neon-mobile.png
            ${{ runner.temp }}/neon-dom.html
          retention-days: 14
      - name: Record successful NEON DOMINION publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "[AUTO] NEON DOMINION профиль на главной опубликован ${{ github.sha }}" --body "Главный профиль, магазин и Arsenal опубликованы и проверены в Chromium: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/neon-dominion/"
