name: Deploy browser games to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate main project
        run: npm run check
      - name: Validate AeroSphere
        run: |
          cd world-air-network
          npm run check
          node --check src/polish.js
          node --check src/route-guard.js
          node --check sw.js
          test -s polish.css
          grep -q "installRiskAdvisor" src/route-guard.js
      - name: Validate UAV simulator
        run: |
          set -e
          for file in \
            uav-sim/data.js \
            uav-sim/app.js \
            uav-sim/map.js \
            uav-sim/flight.js \
            uav-sim/controls.js \
            uav-sim/skins.js \
            uav-sim/sw.js; do
            node --check "$file"
          done
          test -s uav-sim/index.html
          test -s uav-sim/styles.css
          test -s uav-sim/skins.css
          test -s uav-sim/assets/uav-skins.svg
          test -s uav-sim/manifest.webmanifest
          test -s uav-sim/icon.svg
          grep -q "Аврора Полёт" uav-sim/index.html
          grep -q "MISSION_CATALOG" uav-sim/data.js
          grep -q "serviceWorker" uav-sim/controls.js
          grep -q "installUavSkins" uav-sim/controls.js
          grep -q "uav-skin-preview" uav-sim/skins.js

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify UAV simulator endpoint and assets
        run: |
          set -e
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/uav-sim"
          curl --fail --location --retry 18 --retry-delay 5 --retry-all-errors --max-time 20 "$BASE/" | grep -q "Аврора Полёт"
          for asset in styles.css skins.css data.js app.js map.js flight.js controls.js skins.js assets/uav-skins.svg manifest.webmanifest icon.svg; do
            curl --fail --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "$BASE/$asset" >/dev/null
          done
          echo "Verified assets: $BASE/"

      - name: Verify AeroSphere endpoint and all runtime assets
        run: |
          set -e
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/world-air-network"
          curl --fail --location --retry 18 --retry-delay 5 --retry-all-errors --max-time 20 "$BASE/" | grep -q "AeroSphere"
          for asset in styles.css polish.css src/data.js src/engine.js src/game.js src/polish.js src/route-guard.js sw.js manifest.webmanifest assets/icon.svg; do
            curl --fail --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "$BASE/$asset" >/dev/null
          done
          curl --fail --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "$BASE/src/route-guard.js" | grep -q "installRiskAdvisor"
          echo "Verified AeroSphere: $BASE/"

      - name: Open published games in Chromium
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"

          UAV_BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/uav-sim/?build=${{ github.sha }}"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,900 \
            --virtual-time-budget=12000 \
            --dump-dom "$UAV_BASE" > "$RUNNER_TEMP/uav-dom.html"
          grep -q 'data-mission="daily"' "$RUNNER_TEMP/uav-dom.html"
          grep -q 'data-model="mini"' "$RUNNER_TEMP/uav-dom.html"
          grep -q 'data-skin="mini"' "$RUNNER_TEMP/uav-dom.html"
          grep -q 'КАРЬЕРА ПИЛОТА' "$RUNNER_TEMP/uav-dom.html"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,900 \
            --virtual-time-budget=9000 \
            --screenshot="$RUNNER_TEMP/uav-desktop.png" "$UAV_BASE"

          AERO_BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/world-air-network/?build=${{ github.sha }}"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,900 \
            --virtual-time-budget=12000 \
            --dump-dom "$AERO_BASE" > "$RUNNER_TEMP/aerosphere-dom.html"
          grep -q 'AeroSphere' "$RUNNER_TEMP/aerosphere-dom.html"
          grep -q 'id="worldMap"' "$RUNNER_TEMP/aerosphere-dom.html"
          grep -q 'id="moneyStat"' "$RUNNER_TEMP/aerosphere-dom.html"
          grep -q 'id="citySearch"' "$RUNNER_TEMP/aerosphere-dom.html"
          grep -q 'risk-advisor' "$RUNNER_TEMP/aerosphere-dom.html"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,900 \
            --virtual-time-budget=9000 \
            --screenshot="$RUNNER_TEMP/aerosphere-desktop.png" "$AERO_BASE"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=390,844 \
            --force-device-scale-factor=1 \
            --virtual-time-budget=9000 \
            --screenshot="$RUNNER_TEMP/aerosphere-mobile.png" "$AERO_BASE"
          test -s "$RUNNER_TEMP/uav-desktop.png"
          test -s "$RUNNER_TEMP/aerosphere-desktop.png"
          test -s "$RUNNER_TEMP/aerosphere-mobile.png"
          echo "Chromium tests passed"

      - name: Upload browser screenshots
        uses: actions/upload-artifact@v4
        with:
          name: browser-games-check-${{ github.sha }}
          path: |
            ${{ runner.temp }}/uav-desktop.png
            ${{ runner.temp }}/uav-dom.html
            ${{ runner.temp }}/aerosphere-desktop.png
            ${{ runner.temp }}/aerosphere-mobile.png
            ${{ runner.temp }}/aerosphere-dom.html
          retention-days: 14

      - name: Record successful AeroSphere publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[AUTO] AeroSphere опубликована ${{ github.sha }}" \
            --body "AeroSphere опубликована и проверена в Chromium: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/world-air-network/"
