name: Deploy Aurora Eleven to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Validate UAV simulator
        run: |
          set -e
          for file in \
            uav-sim/data.js \
            uav-sim/app.js \
            uav-sim/map.js \
            uav-sim/flight.js \
            uav-sim/controls.js \
            uav-sim/sw.js; do
            node --check "$file"
          done
          test -s uav-sim/index.html
          test -s uav-sim/styles.css
          test -s uav-sim/manifest.webmanifest
          test -s uav-sim/icon.svg
          grep -q "Аврора Полёт" uav-sim/index.html
          grep -q "MISSION_CATALOG" uav-sim/data.js
          grep -q "serviceWorker" uav-sim/controls.js

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify simulator endpoint and assets
        run: |
          set -e
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/uav-sim"
          curl --fail --location --retry 18 --retry-delay 5 --retry-all-errors --max-time 20 "$BASE/" | grep -q "Аврора Полёт"
          for asset in styles.css data.js app.js map.js flight.js controls.js manifest.webmanifest icon.svg; do
            curl --fail --location --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "$BASE/$asset" >/dev/null
          done
          echo "Verified: $BASE/"
      - name: Record successful publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[AUTO] Публикация игры проверена ${{ github.sha }}" \
            --body "GitHub Pages доступен: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/uav-sim/"
