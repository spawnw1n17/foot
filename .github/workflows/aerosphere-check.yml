name: Check AeroSphere

on:
  push:
    branches: [world-air-network]
    paths:
      - 'world-air-network/**'
      - '.github/workflows/aerosphere-check.yml'
  pull_request:
    paths:
      - 'world-air-network/**'
      - '.github/workflows/aerosphere-check.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world-air-network
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run checks
        run: npm run check
