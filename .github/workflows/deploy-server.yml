name: Deploy Aurora Eleven to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: node --check app.js

      - name: Upload site files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "index.html,styles.css,app.js,manifest.webmanifest,sw.js,icon.svg"
          target: "/var/www/foot"
          overwrite: true

      - name: Configure Nginx and activate site
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            if ! command -v nginx >/dev/null 2>&1; then
              apt-get update
              apt-get install -y nginx
            fi
            mkdir -p /var/www/foot
            chown -R www-data:www-data /var/www/foot
            find /var/www/foot -type d -exec chmod 755 {} \;
            find /var/www/foot -type f -exec chmod 644 {} \;
            cat > /etc/nginx/sites-available/foot <<'NGINX'
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name _;

                root /var/www/foot;
                index index.html;

                location / {
                    try_files $uri $uri/ /index.html;
                }

                location ~* \.(?:css|js|svg|webmanifest)$ {
                    expires 1h;
                    add_header Cache-Control "public, max-age=3600";
                    try_files $uri =404;
                }
            }
            NGINX
            rm -f /etc/nginx/sites-enabled/default
            ln -sfn /etc/nginx/sites-available/foot /etc/nginx/sites-enabled/foot
            if command -v ufw >/dev/null 2>&1; then
              ufw allow 80/tcp || true
            fi
            nginx -t
            systemctl enable nginx
            systemctl restart nginx

      - name: Verify deployed site
        run: curl --fail --retry 10 --retry-delay 3 --max-time 15 "http://${{ secrets.SERVER_HOST }}/"
