name: NEON DOMINION QA

on:
  push:
    branches: [main, neon-dominion-release]
    paths:
      - 'neon-dominion/**'
      - '.github/workflows/neon-dominion.yml'
  pull_request:
    paths:
      - 'neon-dominion/**'
      - '.github/workflows/neon-dominion.yml'
      - '.github/scripts/apply-neon-chain.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Apply chained full-send patch
        if: github.head_ref == 'neon-chain-drag-v3' || github.ref_name == 'neon-chain-drag-v3'
        run: python3 .github/scripts/apply-neon-chain.py
      - name: Commit generated patch to feature branch
        if: github.head_ref == 'neon-chain-drag-v3' || github.ref_name == 'neon-chain-drag-v3'
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add neon-dominion
          git commit -m "Добавить цепную отправку полного гарнизона"
          git push origin HEAD:neon-chain-drag-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check engine and syntax
        working-directory: neon-dominion
        run: npm run check
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          python3 -m http.server 8080 > "$RUNNER_TEMP/neon-server.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/neon-dominion/ | grep -q "NEON DOMINION"; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/neon-server.log"
          exit 1
      - name: Run desktop and mobile browser scenario
        env:
          NEON_DOMINION_URL: http://127.0.0.1:8080/neon-dominion/
          QA_OUTPUT_DIR: artifacts/neon-dominion
        run: node neon-dominion/tests/browser-check.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-dominion-qa-${{ github.sha }}
          path: |
            artifacts/neon-dominion
            neon-dominion/src
            neon-dominion/tests
            ${{ runner.temp }}/neon-server.log
          retention-days: 14
