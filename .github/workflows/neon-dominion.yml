name: NEON DOMINION QA

on:
  push:
    branches: [main, neon-dominion-release, neon-full-browser-audit-v8]
    paths:
      - 'neon-dominion/**'
      - '.github/workflows/neon-dominion.yml'
  pull_request:
    paths:
      - 'neon-dominion/**'
      - '.github/workflows/neon-dominion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply discovered audit fixes
        id: patch
        run: |
          set -e
          if [ -f neon-dominion/tools/apply_full_audit_fixes.py ]; then
            python3 neon-dominion/tools/apply_full_audit_fixes.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Исправить дефекты, найденные полным Chromium-аудитом"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
            echo "patched=true" >> "$GITHUB_OUTPUT"
          else
            echo "patched=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check all engines and tests
        if: steps.patch.outputs.patched != 'true'
        working-directory: neon-dominion
        run: npm run check
      - name: Install Chromium
        if: steps.patch.outputs.patched != 'true'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start server
        if: steps.patch.outputs.patched != 'true'
        run: |
          python3 -m http.server 8080 > "$RUNNER_TEMP/neon-server.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/neon-dominion/ | grep -q "NEON DOMINION"; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/neon-server.log"
          exit 1
      - name: Run complete browser audit
        if: steps.patch.outputs.patched != 'true'
        env:
          NEON_DOMINION_URL: http://127.0.0.1:8080/neon-dominion/
          QA_OUTPUT_DIR: artifacts/neon-dominion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('neon-dominion/tests/full-audit.mjs')
          text = path.read_text()
          text = text.replace("  await page.locator('#profileNameInput').fill('Аудитор');", "  await page.evaluate(() => window.NeonDominionQA.openMeta('profile'));\n  await page.waitForSelector('#profileNameInput');\n  await page.locator('#profileNameInput').fill('Аудитор');")
          path.write_text(text)
          PY
          node neon-dominion/tests/browser-check.mjs
          node neon-dominion/tests/home-profile-check.mjs
          node neon-dominion/tests/war-room-browser.mjs
          node neon-dominion/tests/full-audit.mjs
      - name: Upload screenshots and reports
        if: always() && steps.patch.outputs.patched != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: neon-dominion-full-audit-${{ github.sha }}
          path: |
            artifacts/neon-dominion
            neon-dominion/src
            neon-dominion/tests
            neon-dominion/WAR-ROOM.md
            ${{ runner.temp }}/neon-server.log
          retention-days: 14
